<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="830" viewBox="0 0 1152 830" lang="zh-CN" role="img" aria-labelledby="title desc">
  <title id="title">Prompt、RAG 和 Skill 的维恩式关系图</title>
  <desc id="desc">Prompt、RAG 和 Skill 可以独立出现，也可以按任务需要组合。Skill 是可复用任务包，可以组织 Prompt、数据库、API、代码等工具、校验与失败处理；RAG 可以调用工具取得外部证据，并使用 Prompt 指导基于证据的生成。图中的重叠不表示固定的严格包含关系。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #222826; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #66706c; }
      .badge { font-size: 14px; font-weight: 700; fill: #4f5a55; }
      .group-title { font-size: 28px; font-weight: 700; }
      .group-subtitle { font-size: 16px; fill: #4f5a55; }
      .card-title { font-size: 17px; font-weight: 700; }
      .card-body { font-size: 14px; fill: #4f5a55; }
      .chip { font-size: 15px; font-weight: 700; }
      .center-kicker { font-size: 13px; font-weight: 700; fill: #2f6f5b; letter-spacing: 0.02em; }
      .center-title { font-size: 17px; font-weight: 700; }
      .footer { font-size: 14px; fill: #4f5a55; }
    </style>
  </defs>

  <rect width="1152" height="830" fill="#faf9f6"/>
  <text class="title" x="64" y="55">Prompt、RAG 和 Skill 的关系</text>
  <text class="subtitle" x="64" y="89">它们可以独立出现，也可以在同一套任务中相互组合。</text>
  <rect x="826" y="27" width="262" height="42" rx="7" fill="#f0efeb" stroke="#8b918e" stroke-width="1.5"/>
  <text class="badge" x="957" y="54" text-anchor="middle">维恩式示意｜非严格集合</text>

  <ellipse cx="420" cy="420" rx="300" ry="245" fill="#f4e7cd" fill-opacity="0.72" stroke="#7d4b00" stroke-width="2.4" stroke-dasharray="9 7"/>
  <ellipse cx="732" cy="420" rx="300" ry="245" fill="#dfece5" fill-opacity="0.72" stroke="#2f6f5b" stroke-width="2.4" stroke-dasharray="9 7"/>
  <ellipse cx="576" cy="575" rx="250" ry="190" fill="#dce9f0" fill-opacity="0.78" stroke="#356a8a" stroke-width="2.4" stroke-dasharray="9 7"/>

  <g aria-label="Skill 可复用任务包">
    <text class="group-title" x="242" y="211" text-anchor="middle" fill="#7d4b00">Skill</text>
    <text class="group-subtitle" x="242" y="237" text-anchor="middle">可复用任务包</text>

    <rect x="145" y="263" width="220" height="76" rx="9" fill="#ffffff" fill-opacity="0.9" stroke="#9a7a5e" stroke-width="1.5"/>
    <text class="card-title" x="255" y="292" text-anchor="middle">任务编排</text>
    <text class="card-body" x="255" y="318" text-anchor="middle">输入 · 步骤 · 输出</text>

    <rect x="145" y="356" width="220" height="88" rx="9" fill="#ffffff" fill-opacity="0.9" stroke="#9a7a5e" stroke-width="1.5"/>
    <text class="card-title" x="255" y="385" text-anchor="middle">校验与失败处理</text>
    <text class="card-body" x="255" y="409" text-anchor="middle">
      <tspan x="255" dy="0">格式 · 完整性</tspan>
      <tspan x="255" dy="20">失败时明确停止</tspan>
    </text>
  </g>

  <g aria-label="RAG 检索增强生成流程">
    <text class="group-title" x="910" y="211" text-anchor="middle" fill="#2f6f5b">RAG</text>
    <text class="group-subtitle" x="910" y="237" text-anchor="middle">检索增强生成流程</text>

    <rect x="787" y="263" width="220" height="76" rx="9" fill="#ffffff" fill-opacity="0.9" stroke="#6c8d80" stroke-width="1.5"/>
    <text class="card-title" x="897" y="292" text-anchor="middle">检索与上下文组装</text>
    <text class="card-body" x="897" y="318" text-anchor="middle">搜索 · 排序 · 证据选择</text>

    <rect x="787" y="356" width="220" height="88" rx="9" fill="#ffffff" fill-opacity="0.9" stroke="#6c8d80" stroke-width="1.5"/>
    <text class="card-title" x="897" y="385" text-anchor="middle">基于证据生成</text>
    <text class="card-body" x="897" y="409" text-anchor="middle">
      <tspan x="897" dy="0">回答可追溯到</tspan>
      <tspan x="897" dy="20">检索结果</tspan>
    </text>
  </g>

  <g aria-label="Skill 中可以包含工具">
    <rect x="486" y="286" width="180" height="94" rx="9" fill="#ffffff" fill-opacity="0.94" stroke="#66706c" stroke-width="1.5"/>
    <text class="card-title" x="576" y="315" text-anchor="middle">Skill 中的工具</text>
    <text class="card-body" x="576" y="341" text-anchor="middle">数据库 · API · 代码</text>
    <text class="card-body" x="576" y="365" text-anchor="middle">也可支持 RAG 检索</text>
  </g>

  <g aria-label="三者共同使用">
    <rect x="486" y="425" width="180" height="96" rx="11" fill="#ffffff" fill-opacity="0.95" stroke="#2f6f5b" stroke-width="1.8"/>
    <text class="center-kicker" x="576" y="450" text-anchor="middle">PROMPT + RAG + SKILL</text>
    <text class="center-title" x="576" y="480" text-anchor="middle">有依据、可复用的</text>
    <text class="center-title" x="576" y="505" text-anchor="middle">AI 任务</text>
  </g>

  <g aria-label="Skill 和 Prompt 的组合">
    <rect x="326" y="535" width="180" height="42" rx="21" fill="#ffffff" fill-opacity="0.92" stroke="#7d4b00" stroke-width="1.4"/>
    <text class="chip" x="416" y="562" text-anchor="middle">Skill 可包含 Prompt</text>
  </g>

  <g aria-label="RAG 和 Prompt 的组合">
    <rect x="646" y="535" width="180" height="42" rx="21" fill="#ffffff" fill-opacity="0.92" stroke="#2f6f5b" stroke-width="1.4"/>
    <text class="chip" x="736" y="562" text-anchor="middle">RAG 可使用 Prompt</text>
  </g>

  <g aria-label="Prompt 一次模型调用的指令与上下文">
    <text class="group-title" x="576" y="688" text-anchor="middle" fill="#356a8a">Prompt</text>
    <text class="group-subtitle" x="576" y="716" text-anchor="middle">一次模型调用的指令与上下文</text>
    <text class="card-body" x="576" y="742" text-anchor="middle">任务 · 证据边界 · 输出格式</text>
  </g>

  <rect x="64" y="784" width="1024" height="34" rx="7" fill="#f0efeb"/>
  <text class="footer" x="576" y="806" text-anchor="middle">重叠表示“可以组合或调用”，并非永久包含；Prompt、RAG 和 Skill 都可以独立出现。</text>
</svg>
