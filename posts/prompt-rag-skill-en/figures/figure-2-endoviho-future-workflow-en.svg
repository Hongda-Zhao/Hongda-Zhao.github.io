<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="830" viewBox="0 0 1152 830" lang="en" role="img" aria-labelledby="title desc">
  <title id="title">Proposed EndoViHo-RAG workflow and responsibility boundaries</title>
  <desc id="desc">This is a proposed design, not implemented functionality. A Skill would orchestrate the user question, name normalization, route selection, retrieval, generation, and programmatic validation. Retrieval would form the retrieval stage of RAG by obtaining evidence from versioned structured records and a fixed literature corpus. A Prompt would constrain generation, and programmatic checks would validate numbers, identifiers, versions, citations, and empty results.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Arial, sans-serif; fill: #222826; }
      .title { font-size: 31px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #66706c; }
      .range { font-size: 17px; font-weight: 700; fill: #654a38; }
      .node-title { font-size: 20px; font-weight: 700; }
      .node-body { font-size: 16px; }
      .small { font-size: 15px; fill: #4f5a55; }
      .tiny { font-size: 14px; fill: #4f5a55; }
      .failure-text { fill: #a8443f; }
      .label { font-size: 16px; font-weight: 700; }
      .badge { font-size: 13px; font-weight: 700; letter-spacing: 0.01em; }
      .output-title { font-size: 20px; font-weight: 700; }
      .arrow { fill: none; stroke: #8b918e; stroke-width: 2.4; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #8b918e; stroke-width: 2.2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b918e"/>
    </marker>
  </defs>

  <rect width="1152" height="830" fill="#faf9f6"/>
  <text class="title" x="64" y="54">EndoViHo-RAG: proposed Hybrid RAG workflow</text>
  <text class="subtitle" x="64" y="88">Structured facts, literature evidence, generation, and programmatic checks retain separate boundaries.</text>
  <rect x="765" y="25" width="323" height="42" rx="7" fill="#f2dfdc" stroke="#a8443f" stroke-width="1.6"/>
  <text class="badge" x="926.5" y="52" text-anchor="middle" fill="#a8443f">PROPOSED DESIGN · NOT YET IMPLEMENTED</text>

  <path d="M 64 132 V 119 H 1088 V 132" fill="none" stroke="#654a38" stroke-width="2"/>
  <text class="range" x="576" y="113" text-anchor="middle">Skill | orchestrates tasks, calls tools, and defines failure behavior</text>

  <g aria-label="User question">
    <rect x="64" y="151" width="226" height="94" rx="10" fill="#ffffff" stroke="#654a38" stroke-width="2"/>
    <text class="node-title" x="177" y="184" text-anchor="middle">User question</text>
    <text class="small" x="177" y="211" text-anchor="middle">
      <tspan x="177" dy="0">Natural-language</tspan>
      <tspan x="177" dy="20">research question</tspan>
    </text>
  </g>
  <path class="arrow" d="M 290 198 H 341"/>

  <g aria-label="Name normalization">
    <rect x="342" y="151" width="226" height="94" rx="10" fill="#f4e7cd" stroke="#7d4b00" stroke-width="2"/>
    <text class="node-title" x="455" y="184" text-anchor="middle">Name normalization</text>
    <text class="small" x="455" y="218" text-anchor="middle">Map to a controlled taxonomy</text>
  </g>
  <path class="arrow" d="M 568 198 H 619"/>

  <g aria-label="Choose a retrieval route">
    <rect x="620" y="151" width="292" height="94" rx="10" fill="#f4e7cd" stroke="#7d4b00" stroke-width="2"/>
    <text class="node-title" x="766" y="181" text-anchor="middle">Choose a retrieval route</text>
    <text class="node-body" x="766" y="211" text-anchor="middle">structured · literature · hybrid</text>
    <text class="small" x="766" y="235" text-anchor="middle">Stop clearly when unsupported</text>
  </g>

  <path class="arrow" d="M 766 245 V 278 H 426 V 305"/>
  <path class="arrow" d="M 766 278 H 867 V 305"/>
  <circle cx="766" cy="278" r="4" fill="#8b918e"/>

  <g aria-label="RAG retrieval stage">
    <rect x="64" y="305" width="142" height="138" rx="10" fill="#dfece5" stroke="#2f6f5b" stroke-width="2"/>
    <text class="label" x="135" y="341" text-anchor="middle" fill="#2f6f5b">Retrieval</text>
    <text class="tiny" x="135" y="371" text-anchor="middle">RAG retrieval stage</text>
    <text class="tiny" x="135" y="400" text-anchor="middle">Retrieve and organize</text>
    <text class="tiny" x="135" y="421" text-anchor="middle">external evidence</text>
  </g>

  <g aria-label="Versioned structured records">
    <rect x="248" y="305" width="356" height="138" rx="10" fill="#e8f1eb" stroke="#2f6f5b" stroke-width="2"/>
    <text class="node-title" x="426" y="344" text-anchor="middle">Versioned structured records</text>
    <text class="node-body" x="426" y="380" text-anchor="middle">Assembly source taxon · EVE loci</text>
    <text class="small" x="426" y="411" text-anchor="middle">IDs, counts, and dataset version</text>
  </g>

  <g aria-label="Fixed literature corpus">
    <rect x="646" y="305" width="442" height="138" rx="10" fill="#dfece5" stroke="#2f6f5b" stroke-width="2"/>
    <text class="node-title" x="867" y="344" text-anchor="middle">Fixed literature corpus</text>
    <text class="node-body" x="867" y="380" text-anchor="middle">Full text · semantic retrieval</text>
    <text class="small" x="867" y="411" text-anchor="middle">Evidence passages, sources, and scope</text>
  </g>

  <path class="arrow" d="M 426 443 V 476 H 485 V 500"/>
  <path class="arrow" d="M 867 443 V 476 H 485 V 500"/>

  <g aria-label="Prompt">
    <rect x="64" y="500" width="210" height="126" rx="10" fill="#dce9f0" stroke="#356a8a" stroke-width="2"/>
    <text class="node-title" x="169" y="538" text-anchor="middle">Prompt</text>
    <text class="node-body" x="169" y="570" text-anchor="middle">Task · evidence limits</text>
    <text class="small" x="169" y="598" text-anchor="middle">Output fields and wording</text>
  </g>

  <g aria-label="Evidence bundle called ContextPack">
    <rect x="310" y="500" width="350" height="126" rx="10" fill="#dfece5" stroke="#2f6f5b" stroke-width="2"/>
    <text class="node-title" x="485" y="538" text-anchor="middle">Evidence bundle (ContextPack)</text>
    <text class="node-body" x="485" y="570" text-anchor="middle">StructuredResult · RetrievedChunks</text>
    <text class="tiny" x="485" y="598" text-anchor="middle">Sources · limits · data and corpus versions</text>
  </g>

  <path class="arrow" d="M 169 626 V 642 H 776 V 634"/>
  <path class="arrow" d="M 660 563 H 692"/>

  <g aria-label="RAG generation stage">
    <rect x="693" y="500" width="166" height="126" rx="10" fill="#ffffff" stroke="#654a38" stroke-width="2"/>
    <text class="tiny" x="776" y="522" text-anchor="middle">RAG generation stage</text>
    <text class="node-title" x="776" y="549" text-anchor="middle">LLM</text>
    <text class="small" x="776" y="575" text-anchor="middle">Organize and explain</text>
    <text class="tiny" x="776" y="597" text-anchor="middle">
      <tspan x="776" dy="0">Never invent</tspan>
      <tspan x="776" dy="18">numbers or IDs</tspan>
    </text>
  </g>
  <path class="arrow" d="M 859 563 H 899"/>

  <g aria-label="Programmatic validation">
    <rect x="900" y="500" width="188" height="126" rx="10" fill="#f0efeb" stroke="#66706c" stroke-width="2"/>
    <text class="node-title" x="994" y="531" text-anchor="middle">
      <tspan x="994" dy="0">Programmatic</tspan>
      <tspan x="994" dy="23">validation</tspan>
    </text>
    <text class="small" x="994" y="580" text-anchor="middle">Numbers · IDs · versions</text>
    <text class="tiny" x="994" y="605" text-anchor="middle">Citations · empty results</text>
  </g>

  <path class="branch" d="M 994 626 V 668"/>
  <circle cx="994" cy="668" r="4" fill="#8b918e"/>
  <path class="arrow" d="M 994 668 H 699 V 704"/>
  <path class="arrow" d="M 994 668 H 169 V 704"/>
  <text class="small" x="720" y="695">Passed</text>
  <text class="tiny failure-text" x="169" y="695" text-anchor="middle">Retrieval or validation failed</text>

  <g aria-label="Failure handling">
    <rect x="64" y="705" width="210" height="94" rx="10" fill="#f2dfdc" stroke="#a8443f" stroke-width="2"/>
    <text class="node-title failure-text" x="169" y="742" text-anchor="middle">Stop clearly</text>
    <text class="small" x="169" y="772" text-anchor="middle">Report the failure</text>
  </g>

  <g aria-label="Structured answer">
    <rect x="310" y="705" width="778" height="94" rx="10" fill="#ffffff" stroke="#2f6f5b" stroke-width="2"/>
    <text class="output-title" x="344" y="743" fill="#2f6f5b">Structured answer with evidence limits</text>
    <text class="node-body" x="344" y="773">Table · sources · dataset version · limitations</text>
    <text class="node-body" x="1050" y="743" text-anchor="end">“No record in the current dataset”</text>
    <text class="small" x="1050" y="773" text-anchor="end">≠ “Biologically absent”</text>
  </g>
</svg>
