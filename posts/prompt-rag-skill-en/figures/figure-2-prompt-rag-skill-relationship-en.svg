<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="830" viewBox="0 0 1152 830" lang="en" role="img" aria-labelledby="title desc">
  <title id="title">Venn-style relationship map for Prompts, RAG, and Skills</title>
  <desc id="desc">Prompts, RAG, and Skills can be used independently or together. A Skill is a reusable task package that can organize Prompts, tools such as databases, APIs, and code, validation, and failure handling. RAG can call tools to retrieve external evidence and use a Prompt to guide evidence-grounded generation. The overlaps do not represent a fixed containment hierarchy.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Arial, sans-serif; fill: #222826; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #66706c; }
      .badge { font-size: 13px; font-weight: 700; fill: #4f5a55; letter-spacing: 0.01em; }
      .group-title { font-size: 28px; font-weight: 700; }
      .group-subtitle { font-size: 15px; fill: #4f5a55; }
      .card-title { font-size: 15px; font-weight: 700; }
      .card-body { font-size: 13px; fill: #4f5a55; }
      .chip { font-size: 13px; font-weight: 700; }
      .center-kicker { font-size: 12px; font-weight: 700; fill: #2f6f5b; letter-spacing: 0.02em; }
      .center-title { font-size: 17px; font-weight: 700; }
      .footer { font-size: 13px; fill: #4f5a55; }
    </style>
  </defs>

  <rect width="1152" height="830" fill="#faf9f6"/>
  <text class="title" x="64" y="55">How Prompts, RAG, and Skills Relate</text>
  <text class="subtitle" x="64" y="89">They can be used independently or combined within the same task.</text>
  <rect x="799" y="27" width="289" height="42" rx="7" fill="#f0efeb" stroke="#8b918e" stroke-width="1.5"/>
  <text class="badge" x="943.5" y="53" text-anchor="middle">VENN-STYLE MAP · NOT STRICT SETS</text>

  <ellipse cx="420" cy="420" rx="300" ry="245" fill="#f4e7cd" fill-opacity="0.72" stroke="#7d4b00" stroke-width="2.4" stroke-dasharray="9 7"/>
  <ellipse cx="732" cy="420" rx="300" ry="245" fill="#dfece5" fill-opacity="0.72" stroke="#2f6f5b" stroke-width="2.4" stroke-dasharray="9 7"/>
  <ellipse cx="576" cy="575" rx="250" ry="190" fill="#dce9f0" fill-opacity="0.78" stroke="#356a8a" stroke-width="2.4" stroke-dasharray="9 7"/>

  <g aria-label="Skill reusable task package">
    <text class="group-title" x="242" y="211" text-anchor="middle" fill="#7d4b00">Skill</text>
    <text class="group-subtitle" x="242" y="237" text-anchor="middle">Reusable task package</text>

    <rect x="145" y="263" width="220" height="76" rx="9" fill="#ffffff" fill-opacity="0.9" stroke="#9a7a5e" stroke-width="1.5"/>
    <text class="card-title" x="255" y="292" text-anchor="middle">Task orchestration</text>
    <text class="card-body" x="255" y="318" text-anchor="middle">Inputs · steps · outputs</text>

    <rect x="145" y="356" width="220" height="88" rx="9" fill="#ffffff" fill-opacity="0.9" stroke="#9a7a5e" stroke-width="1.5"/>
    <text class="card-title" x="255" y="385" text-anchor="middle">Validation &amp; failure handling</text>
    <text class="card-body" x="255" y="409" text-anchor="middle">
      <tspan x="255" dy="0">Format · completeness</tspan>
      <tspan x="255" dy="20">Explicit stops on failure</tspan>
    </text>
  </g>

  <g aria-label="RAG retrieval-augmented generation workflow">
    <text class="group-title" x="910" y="211" text-anchor="middle" fill="#2f6f5b">RAG</text>
    <text class="group-subtitle" x="910" y="237" text-anchor="middle">Retrieval-augmented generation workflow</text>

    <rect x="787" y="263" width="220" height="76" rx="9" fill="#ffffff" fill-opacity="0.9" stroke="#6c8d80" stroke-width="1.5"/>
    <text class="card-title" x="897" y="292" text-anchor="middle">Retrieval &amp; context assembly</text>
    <text class="card-body" x="897" y="318" text-anchor="middle">Search · rank · select evidence</text>

    <rect x="787" y="356" width="220" height="88" rx="9" fill="#ffffff" fill-opacity="0.9" stroke="#6c8d80" stroke-width="1.5"/>
    <text class="card-title" x="897" y="385" text-anchor="middle">Grounded generation</text>
    <text class="card-body" x="897" y="409" text-anchor="middle">
      <tspan x="897" dy="0">Answers trace back to</tspan>
      <tspan x="897" dy="20">retrieved evidence</tspan>
    </text>
  </g>

  <g aria-label="A Skill can contain tools">
    <rect x="486" y="286" width="180" height="94" rx="9" fill="#ffffff" fill-opacity="0.94" stroke="#66706c" stroke-width="1.5"/>
    <text class="card-title" x="576" y="315" text-anchor="middle">Tools inside a Skill</text>
    <text class="card-body" x="576" y="341" text-anchor="middle">Databases · APIs · code</text>
    <text class="card-body" x="576" y="365" text-anchor="middle">May also support RAG retrieval</text>
  </g>

  <g aria-label="All three combined">
    <rect x="486" y="425" width="180" height="96" rx="11" fill="#ffffff" fill-opacity="0.95" stroke="#2f6f5b" stroke-width="1.8"/>
    <text class="center-kicker" x="576" y="450" text-anchor="middle">PROMPT + RAG + SKILL</text>
    <text class="center-title" x="576" y="480" text-anchor="middle">Evidence-grounded,</text>
    <text class="center-title" x="576" y="505" text-anchor="middle">reusable AI task</text>
  </g>

  <g aria-label="Skill and Prompt combination">
    <rect x="316" y="535" width="200" height="42" rx="21" fill="#ffffff" fill-opacity="0.92" stroke="#7d4b00" stroke-width="1.4"/>
    <text class="chip" x="416" y="562" text-anchor="middle">A Skill may include a Prompt</text>
  </g>

  <g aria-label="RAG and Prompt combination">
    <rect x="636" y="535" width="200" height="42" rx="21" fill="#ffffff" fill-opacity="0.92" stroke="#2f6f5b" stroke-width="1.4"/>
    <text class="chip" x="736" y="562" text-anchor="middle">RAG may use a Prompt</text>
  </g>

  <g aria-label="Prompt instructions and context for one model call">
    <text class="group-title" x="576" y="688" text-anchor="middle" fill="#356a8a">Prompt</text>
    <text class="group-subtitle" x="576" y="716" text-anchor="middle">Instructions and context for one model call</text>
    <text class="card-body" x="576" y="742" text-anchor="middle">Task · evidence boundaries · output format</text>
  </g>

  <rect x="64" y="784" width="1024" height="34" rx="7" fill="#f0efeb"/>
  <text class="footer" x="576" y="806" text-anchor="middle">Overlap means “may be combined or invoked,” not permanent containment; each concept can also be used independently.</text>
</svg>
