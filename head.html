  const initialLanguage = (() => {
    try { return localStorage.getItem(storageKey) === "zh" ? "zh" : "en"; }
    catch (_error) { return "en"; }
  })();

  document.documentElement.dataset.uiLang = initialLanguage;
  document.documentElement.lang = initialLanguage === "zh" ? "zh-CN" : "en";

  const setLightboxLabels = (language) => {
    const index = language === "zh" ? 1 : 0;
    const controls = [
      [".gclose", "gallery.lightbox.close"],
      [".gprev", "gallery.lightbox.previous"],
      [".gnext", "gallery.lightbox.next"]
    ];

    controls.forEach(([selector, key]) => {
      document.querySelectorAll(selector).forEach((control) => {
        control.setAttribute("aria-label", strings[key][index]);
        control.setAttribute("title", strings[key][index]);
      });
    });

    document.querySelectorAll(".glightbox-container").forEach((dialog) => {
      dialog.setAttribute("role", "dialog");
      dialog.setAttribute("aria-modal", "true");
      dialog.setAttribute("aria-label", strings["gallery.lightbox.viewer"][index]);
    });

    const triggers = document.querySelectorAll(".gallery-lightbox");
    document.querySelectorAll(".glightbox-container .gslide").forEach((slide, slideIndex) => {
      const dialogImage = slide.querySelector(".gslide-image img");
      const sourceImage = triggers[slideIndex]?.querySelector("img");
      if (dialogImage && sourceImage) dialogImage.setAttribute("alt", sourceImage.getAttribute("alt") || "");
    });
  };

  const setupHomeRunningHead = () => {
    const runningHead = document.querySelector(
      "main.content:has(> .coverage-listing) > .latest-heading"
    );
    if (!runningHead || !("IntersectionObserver" in window)) return;

    const label = document.createElement("div");
    label.className = "latest-heading-running";
    label.setAttribute("aria-hidden", "true");

    const labelText = document.createElement("span");
    labelText.dataset.i18n = "coverage.title";
    labelText.textContent = document.querySelector("#coverage")?.textContent.trim() || "";
    label.append(labelText);
    runningHead.prepend(label);

    const sentinel = document.createElement("span");
    sentinel.className = "latest-heading-sentinel";
    sentinel.setAttribute("aria-hidden", "true");
    runningHead.before(sentinel);

    const observer = new IntersectionObserver(([entry]) => {
      const isPastHeading = !entry.isIntersecting && entry.boundingClientRect.top < 0;
      runningHead.classList.toggle("is-stuck", isPastHeading);
    });
    observer.observe(sentinel);
  };

  const setLanguage = (language, persist = true) => {
    const index = language === "zh" ? 1 : 0;
    document.documentElement.dataset.uiLang = language;
    document.documentElement.lang = language === "zh" ? "zh-CN" : "en";

    document.querySelectorAll("[data-i18n]").forEach((element) => {
      const translation = strings[element.dataset.i18n];
      if (translation) element.textContent = translation[index];
    });

    document.querySelectorAll("[data-i18n-aria-label]").forEach((element) => {
      const translation = strings[element.dataset.i18nAriaLabel];
      if (translation) element.setAttribute("aria-label", translation[index]);
    });

    document.querySelectorAll("[data-i18n-alt]").forEach((element) => {
      const translation = strings[element.dataset.i18nAlt];
      if (translation) element.setAttribute("alt", translation[index]);
    });

    document.querySelectorAll("[data-email-user][data-email-domain]").forEach((link) => {
      const address = `${link.dataset.emailUser}${String.fromCharCode(64)}${link.dataset.emailDomain}`;
      link.setAttribute("href", `mailto:${address}`);
      link.setAttribute("aria-label", language === "zh" ? `发送邮件至 ${address}` : `Email ${address}`);
    });

    const footer = document.querySelector(".nav-footer-right");
    if (footer) footer.textContent = strings["footer.tagline"][index];

    const page = location.pathname.split("/").pop() || "index.html";
    let secondaryTitle = document.querySelector(".quarto-secondary-nav-title");
    const translatedPageTitle = document.querySelector("[data-document-title]");
    const isGalleryPage = Boolean(document.querySelector(".gallery-page"));
    if (secondaryTitle && isGalleryPage) {
      if (secondaryTitle.tagName === "H1") {
        const secondaryLabel = document.createElement("span");
        secondaryLabel.className = secondaryTitle.className;
        secondaryLabel.setAttribute("aria-hidden", "true");
        secondaryTitle.replaceWith(secondaryLabel);
        secondaryTitle = secondaryLabel;
      }
      secondaryTitle.textContent = "";
    } else if (secondaryTitle && translatedPageTitle) {
      secondaryTitle.textContent = translatedPageTitle.textContent.trim();
    } else if (secondaryTitle && page === "index.html") {
      secondaryTitle.textContent = strings["coverage.title"][index];
    }

    document.querySelectorAll(".quarto-btn-toggle, .quarto-secondary-nav .no-decor[aria-label]").forEach((toggle) => {
      toggle.setAttribute("aria-label", language === "zh" ? "切换侧栏导航" : "Toggle sidebar navigation");
    });

    const pageTitles = {
      "index.html": ["Hongda Zhao | Notes on life, technology, and research", "赵宏达 | 生活、技术与研究随笔"],
      "projects.html": ["Projects | Hongda Zhao", "项目 | 赵宏达"],
      "publications.html": ["Publications | Hongda Zhao", "论文 | 赵宏达"]
    };
    const documentTitle = document.querySelector("[data-document-title]");
    if (documentTitle) {
      const siteName = language === "zh" ? "赵宏达" : "Hongda Zhao";
      document.title = `${documentTitle.textContent.trim()} | ${siteName}`;
    } else if (pageTitles[page]) {
      document.title = pageTitles[page][index];
    }

    document.querySelectorAll(".language-toggle").forEach((button) => {
      button.textContent = language === "en" ? "中文" : "EN";
      button.setAttribute("aria-label", language === "en" ? "切换至中文" : "Switch to English");
    });

    document.querySelectorAll(".site-sidebar-gallery").forEach((link) => {
      if (page === "gallery.html") link.setAttribute("aria-current", "page");
      else link.removeAttribute("aria-current");
    });

    setLightboxLabels(language);

    if (persist) {
      try { localStorage.setItem(storageKey, language); } catch (_error) {}
    }
  };

  window.addEventListener("DOMContentLoaded", () => {
    setupHomeRunningHead();

    const lightboxObserver = new MutationObserver(() => {
      if (document.querySelector(".glightbox-container")) {
        setLightboxLabels(document.documentElement.dataset.uiLang);
      }
    });
    lightboxObserver.observe(document.body, { childList: true, subtree: true });

    document.querySelectorAll(".language-toggle").forEach((button) => {
      button.addEventListener("click", () => {
        setLanguage(document.documentElement.dataset.uiLang === "zh" ? "en" : "zh");
      });
    });
    setLanguage(initialLanguage, false);
  });
})();
</script>
