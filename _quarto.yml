project:
  type: website
  resources:
    - assets/gallery/**

lang: en

website:
  title: "Hongda Zhao"
  site-url: "https://hongda-zhao.github.io"
  description: "Hongda Zhao — notes on life, technology, research, and academic activities."
  draft-mode: gone
  open-graph:
    image: assets/og.png
    image-alt: "Hongda Zhao — Bioinformatics and Computational Genomics"
  twitter-card:
    card-style: summary_large_image
    image: assets/og.png
    image-alt: "Hongda Zhao — Bioinformatics and Computational Genomics"
  bread-crumbs: false
  sidebar:
    style: floating
    background: white
    border: true
    search: false
    header: |
      <div class="site-sidebar-profile">
        <a class="site-sidebar-home" href="/">
          <img src="/assets/avatar-cat.jpg" width="1078" height="1105" alt="">
          <strong>Hongda Zhao</strong>
        </a>
        <span data-i18n="home.profile.fields">Bioinformatics · Computational genomics · AI for science</span>
        <p data-i18n="home.profile.summary">Research notes, technical work, and field observations.</p>
      </div>
    footer: |
      <div class="site-sidebar-utilities">
        <nav class="site-sidebar-links" aria-label="External profiles" data-i18n-aria-label="sidebar.externalProfiles">
          <a class="site-sidebar-link" href="https://scholar.google.com/citations?user=cc-6KA8AAAAJ&amp;hl=en" target="_blank" rel="noopener noreferrer"><img class="site-sidebar-icon" src="/assets/icons/google-scholar.svg" width="24" height="24" alt="" aria-hidden="true"><span>Google Scholar</span><span class="site-sidebar-arrow" aria-hidden="true">↗</span></a>
          <a class="site-sidebar-link" href="https://github.com/Hongda-Zhao" target="_blank" rel="noopener noreferrer"><img class="site-sidebar-icon" src="/assets/icons/github.svg" width="24" height="24" alt="" aria-hidden="true"><span>GitHub</span><span class="site-sidebar-arrow" aria-hidden="true">↗</span></a>
          <a class="site-sidebar-link" href="https://www.linkedin.com/in/hongda-zhao-0357b5405/" target="_blank" rel="noopener noreferrer"><img class="site-sidebar-icon" src="/assets/icons/linkedin.png" width="635" height="540" alt="" aria-hidden="true"><span>LinkedIn</span><span class="site-sidebar-arrow" aria-hidden="true">↗</span></a>
          <a class="site-sidebar-link" href="https://www.inaturalist.org/people/hongdaz" target="_blank" rel="noopener noreferrer"><img class="site-sidebar-icon site-sidebar-icon-inaturalist" src="/assets/icons/inaturalist.png" width="128" height="128" alt="" aria-hidden="true"><span>iNaturalist</span><span class="site-sidebar-arrow" aria-hidden="true">↗</span></a>
          <a class="site-sidebar-link site-sidebar-email" data-email-user="hongda" data-email-domain="scl.kyoto-u.ac.jp"><img class="site-sidebar-icon" src="/assets/icons/email.svg" width="24" height="24" alt="" aria-hidden="true"><span class="site-sidebar-email-copy"><span data-i18n="sidebar.email">Email</span><small>hongda [at] scl.kyoto-u.ac.jp</small></span></a>
        </nav>
        <div class="site-sidebar-actions">
        <button class="language-toggle" type="button" aria-label="切换至中文">中文</button>
        <a class="site-sidebar-link site-sidebar-gallery" href="/gallery.html"><i class="bi bi-images site-sidebar-icon" aria-hidden="true"></i><span data-i18n="sidebar.gallery">Gallery</span><span class="site-sidebar-arrow" aria-hidden="true">→</span></a>
        </div>
      </div>
    contents: []
  page-footer:
    left: "© Hongda Zhao"
    right: "Notes on life · technology · research"

format:
  html:
    theme:
      light: [cosmo, styles.scss]
    grid:
      sidebar-width: 210px
      body-width: 820px
      margin-width: 120px
      gutter-width: 3rem
    include-in-header: head.html
    toc: false
    smooth-scroll: true
    code-copy: true
    anchor-sections: true

execute:
  freeze: auto
